[package]
name = "mock-yield-vault"
version = "0.1.0"
description = "Helio-owned mock single-asset yield vault for devnet AutoYield CPI testing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_yield_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
